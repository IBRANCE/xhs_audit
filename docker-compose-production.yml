version: '3.8'

# 多节点部署配置（生产环境）
# 架构：
# - 1 个 API 节点（处理 HTTP 请求）
# - 2 个 Crawler Worker 节点（处理爬取任务）
# - 2 个 Audit Worker 节点（处理审核任务）
# - 1 个 PostgreSQL 数据库
# - 1 个 Redis（消息队列 + 分布式锁）
# - 1 个 Selenium Grid Hub + 2 个 Chrome Nodes

services:
  # ================================
  # 基础设施
  # ================================
  
  postgres:
    image: postgres:15-alpine
    container_name: xhs-audit-postgres
    environment:
      POSTGRES_DB: xhs_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: xhs-audit-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  
  # Selenium Grid Hub
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
    environment:
      SE_SESSION_REQUEST_TIMEOUT: 300
      SE_NODE_SESSION_TIMEOUT: 300
      SE_NODE_MAX_SESSIONS: 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Chrome Node 1
  selenium-chrome-1:
    image: selenium/node-chrome:4.24.0
    container_name: selenium-chrome-1
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
      SE_NODE_SESSION_TIMEOUT: 300
    volumes:
      - /dev/shm:/dev/shm
  
  # Chrome Node 2
  selenium-chrome-2:
    image: selenium/node-chrome:4.24.0
    container_name: selenium-chrome-2
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 4
      SE_NODE_SESSION_TIMEOUT: 300
    volumes:
      - /dev/shm:/dev/shm
  
  # ================================
  # API 节点（1个）
  # ================================
  
  api-node:
    image: xhs-audit:latest
    container_name: xhs-audit-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/xhs_audit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SELENIUM_GRID_URL: http://selenium-hub:4444
      WORKER_TYPE: api  # 只处理 API 请求，不启动 Worker
      HOSTNAME: api-node
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://llm-service:1234/v1}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  
  # ================================
  # Crawler Worker 节点（2个）
  # ================================
  
  crawler-worker-1:
    image: xhs-audit:latest
    container_name: xhs-audit-crawler-1
    environment:
      SPRING_PROFILES_ACTIVE: crawler
      DATABASE_URL: jdbc:postgresql://postgres:5432/xhs_audit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SELENIUM_GRID_URL: http://selenium-hub:4444
      HOSTNAME: crawler-node-1
      BLOOM_FILTER_ENABLED: true  # 启用布隆过滤器
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
  
  crawler-worker-2:
    image: xhs-audit:latest
    container_name: xhs-audit-crawler-2
    environment:
      SPRING_PROFILES_ACTIVE: crawler
      DATABASE_URL: jdbc:postgresql://postgres:5432/xhs_audit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SELENIUM_GRID_URL: http://selenium-hub:4444
      HOSTNAME: crawler-node-2
      BLOOM_FILTER_ENABLED: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium-hub:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
  
  # ================================
  # Audit Worker 节点（2个）
  # ================================
  
  audit-worker-1:
    image: xhs-audit:latest
    container_name: xhs-audit-audit-1
    environment:
      SPRING_PROFILES_ACTIVE: audit
      DATABASE_URL: jdbc:postgresql://postgres:5432/xhs_audit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOSTNAME: audit-node-1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://llm-service:1234/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
  
  audit-worker-2:
    image: xhs-audit:latest
    container_name: xhs-audit-audit-2
    environment:
      SPRING_PROFILES_ACTIVE: audit
      DATABASE_URL: jdbc:postgresql://postgres:5432/xhs_audit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOSTNAME: audit-node-2
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://llm-service:1234/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
  
  # ================================
  # 监控（可选）
  # ================================
  
  # Prometheus（指标收集）
  prometheus:
    image: prom/prometheus:latest
    container_name: xhs-audit-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: unless-stopped
  
  # Grafana（可视化）
  grafana:
    image: grafana/grafana:latest
    container_name: xhs-audit-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: xhs-audit-network
