spring:
  application:
    name: xhs-audit
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/xhs_audit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接池配置 - v4.0: 扩容以支持更高并发
      maximum-pool-size: 30          # v4.0: 从 20 扩容到 30
      minimum-idle: 10               # v4.0: 从 5 提升到 10
      connection-timeout: 5000       # v4.0: 从 10s 降低到 5s
      idle-timeout: 300000           # 空闲连接超时时间（5分钟）
      max-lifetime: 1800000          # 连接最大生命周期（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值（60秒）
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}  # 本地 Redis 无密码，注释此行
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20      # v4.0: 从 16 扩容到 20
          max-idle: 10
          min-idle: 4
      stream:
        # v4.0: Redis Stream 配置
        batch-size: 10        # 每次消费消息数
        block-ms: 2000        # 阻塞等待时间
        pending-retry-interval-ms: 60000  # Pending 消息回收间隔
        max-retry-attempts: 3  # 最大重试次数
  
  # Cache配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  
  # Spring AI配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-test}
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:1234/v1}
      chat:
        model: ${OPENAI_CHAT_MODEL:qwen/qwen3-4b}
        temperature: 0.3
        max-tokens: 2000
        think-enabled: ${OPENAI_CHAT_THINK_ENABLED:false}  # 文本模型是否开启思考模式，默认关闭
      vision:
        model: ${OPENAI_VISION_MODEL:zai-org/glm-4.6v-flash}
        temperature: 0.3
        max-tokens: 2000
  
  # 文件上传配置  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 0
  
  web:
    resources:
      static-locations: classpath:/static/

  # Thymeleaf配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8
  
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

# 服务器配置
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  max-http-request-header-size: 10MB

# 审核系统配置
audit:
  # v4.0: Worker 配置
  worker:
    enabled: true
    type: ${WORKER_TYPE:both}  # api / crawler-worker / audit-worker / both
    consumer-name-prefix: ${HOSTNAME:local}
  
  # v4.0: 布隆过滤器配置（可选，用于 URL 去重）
  bloom-filter:
    enabled: ${BLOOM_FILTER_ENABLED:false}  # 默认关闭，生产环境建议开启
    expected-insertions: 100000  # 预期 URL 数量
    false-positive-probability: 0.01  # 误判率 1%
  
  # 爬虫配置
  crawler:
    browser-pool-size: 3
    concurrent-crawl-threads: 3
    timeout-seconds: 30
    retry-times: 3
    headless: true  # 是否使用无头浏览器（开发环境建议false，生产环境建议true）
    delay-ms:
      min: 2000
      max: 5000
    # Selenium Grid 配置
    selenium:
      grid-url: ${SELENIUM_GRID_URL:http://localhost:4444}  # Selenium Grid Hub 地址
      pool-size: ${SELENIUM_POOL_SIZE:8}  # Driver 池大小，支持并发（从4扩容到8）
      page-load-timeout: 20  # 页面加载超时时间（秒）
      implicit-wait: 5  # 隐式等待时间（秒）
      mobile-mode: ${SELENIUM_MOBILE_MODE:true}  # 是否模拟移动设备
  
  # 线程池配置 - v4.0: 扩容
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 1000
    keep-alive-seconds: 60
    await-termination-seconds: 300
    # v4.0: 爬取线程池（保持与 Selenium poolSize 一致）
    crawl-pool-size: 8
    crawl-queue-capacity: 2000
    # v4.0: 审核线程池（扩容到 20）
    audit-core-pool-size: 10
    audit-max-pool-size: 20
    audit-queue-capacity: 2000
    # v4.0: Redis Stream 消费者线程池
    stream-consumer-threads: 4
  
  # Excel配置
  excel:
    max-file-size: 52428800  # 50MB
    max-links-per-file: 5000
    batch-size: 100
  
  # Vision配置（可选）
  vision:
    enabled: false  # v4.1: 是否启用图片审核（可配置关闭以提升性能）
    provider: local-vision
    max-image-size: 20971520  # 20MB
    request-timeout: 30

  # 图片缓存配置
  image-cache-ttl-hours: 24  # 图片base64缓存过期时间（小时）
  
  # LLM调用配置
  llm:
    timeout-seconds: 60  # 已弃用，使用下面的独立配置
    text-timeout-seconds: 90   # v4.1: 文本审核超时（秒）
    image-timeout-seconds: 120 # v4.1: 图片审核超时（秒），视觉模型通常更慢
    max-retries: 3
    retry-delay-ms: 2000
  
  # 规则引擎配置
  rules:
    cache-ttl-minutes: 60
    sensitive-words-refresh-interval-hours: 24

  # 基础规则配置默认值（可通过前端接口覆盖）
  rule-validator:
    min-text-length: 25
    min-image-count: 1
    required-tags:
      - 东风日产
      - 尽兴由NI
    excluded-tags:
      - 东风日产
      - 尽兴由NI
    car-model-names:
      - 天籁
      - 轩逸
      - 逍客
      - 奇骏
      - X-TRAIL
      - ARIYA
      - 艾睿雅
      - N7
      - N6
      - NX8
      - 探陆
      - NISSAN
      - 启辰大V
      - 启辰星
      - 启辰D60
      - 启辰
      - Venucia
      - QX50
      - QX60
      - Q50L
      - 英菲尼迪
      - INFINITI

  # 审核 Prompt 配置
  prompts:
    # 文本审核 System Prompt
    text-system: |
      你是东风日产内容审核专家，负责审核小红书内容的**相关性和态度**。
      
      注意：基础规则（字数、图片、标签）已由系统预检，你只需判断以下2点：

      ============================================
      【审核要点】
      ============================================
      
      1. **内容相关性**（car_model）
         - 内容是否真实涉及东风日产三品牌车型？
         - 品牌：日产(NISSAN)、启辰(Venucia)、英菲尼迪(INFINITI)
         - 常见车型：天籁、轩逸、逍客、奇骏、N7、N6、NX8、探陆、ARIYA、启辰大V、QX50等
         - 警惕：仅提及品牌但无实质车型内容 → REJECTED
      
      2. **内容态度**（attitude）
         - 必须为**正向**内容（用户分享、体验、推荐）
         - 驳回：负面评价、投诉、维权、抱怨等 → REJECTED
         - 边界case（如客观对比）→ UNCERTAIN，交由人工

      ============================================
      【决策标准】
      ============================================
      - PASSED：内容相关且态度正向，置信度 ≥ 0.8
      - REJECTED：内容不相关 或 态度负面
      - UNCERTAIN：置信度 < 0.7 或 难以判断

      ============================================
      【输出格式】（严格JSON）
      ============================================
      {
        "status": "PASSED|REJECTED|UNCERTAIN",
        "reasons": [
          {
            "dimension": "car_model|attitude",
            "reason": "简短理由",
            "severity": "LOW|MEDIUM|HIGH|CRITICAL"
          }
        ],
        "confidenceScore": 0.95,
        "suggestedAction": "通过|驳回|人工复核",
        "riskLevel": "LOW|MEDIUM|HIGH|CRITICAL",
        "modelName": "qwen3-4b"
      }

      【示例】
      ✅ 通过："分享我的天籁用车体验，油耗表现不错" → PASSED
      ❌ 驳回："轩逸变速箱又出问题了，真是烦死了" → REJECTED (负面)
      ❌ 驳回："今天路上看到一辆日产车" → REJECTED (无实质内容)
      ⚠️ 不确定："对比了天籁和雅阁，各有优劣" → UNCERTAIN (需人工)

    # 图片审核 Prompt
    text-image: "请识别这张图片中是否有东风日产三品牌车型（日产NISSAN、启辰Venucia、英菲尼迪INFINITI），回复车型名称或'无'"

    # 图片审核通过的关键词（用于判断结果）
    image-pass-keywords: "天籁|轩逸|逍客|奇骏|N7|探陆|ARIYA|启辰|英菲尼迪|QX50|QX60|Q50L|NISSAN|Venucia|INFINITI"

# 日志配置
logging:
  level:
    root: INFO
    com.xhs.audit: DEBUG
    org.springframework.ai: DEBUG
    org.apache.poi.openxml4j.opc.PackageRelationshipCollection: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/xhs-audit.log
    max-size: 100MB
    max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: xhs-audit
      environment: ${SPRING_PROFILES_ACTIVE:dev}
    distribution:
      percentiles-histogram:
        audit.duration: true
        crawler.duration: true
        llm.duration: true
        http.server.requests: true
        audit.processing.duration: true

# v4.0: Resilience4j 熔断与重试配置
resilience4j:
  circuitbreaker:
    instances:
      llmService:
        failure-rate-threshold: 50          # 失败率超过 50% 开路
        slow-call-rate-threshold: 80        # 慢调用超过 80% 开路
        slow-call-duration-threshold: 60s   # v4.1: 提高到 60s（匹配新的超时配置）
        wait-duration-in-open-state: 30s    # 开路后等待 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-size: 10
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
  
  retry:
    instances:
      llmService:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.util.concurrent.TimeoutException

# v4.0: Redisson 配置
redisson:
  address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  connection-pool-size: 10
  connection-minimum-idle-size: 5
# Springdoc OpenAPI配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: true
