spring:
  application:
    name: xhs-audit
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/xhs_audit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  
  # Cache配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  
  # Spring AI配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-api-key}
      base-url: https://api.openai.com/v1
      model: gpt-4-turbo
      temperature: 0.3
      max-tokens: 2000
  
  # 文件上传配置  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 0
  
  web:
    resources:
      static-locations: classpath:/static/
  
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  max-http-request-header-size: 10MB

# 审核系统配置
audit:
  # 爬虫配置
  crawler:
    browser-pool-size: 3
    concurrent-crawl-threads: 3
    timeout-seconds: 30
    retry-times: 3
    delay-ms:
      min: 2000
      max: 5000
  
  # 线程池配置
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 1000
    keep-alive-seconds: 60
    await-termination-seconds: 300
  
  # Excel配置
  excel:
    max-file-size: 52428800  # 50MB
    max-links-per-file: 5000
    batch-size: 100
  
  # Vision配置（可选）
  vision:
    enabled: false
    provider: gpt-4-vision
    max-image-size: 20971520  # 20MB
    request-timeout: 30
  
  # LLM调用配置
  llm:
    timeout-seconds: 30
    max-retries: 3
    retry-delay-ms: 2000
  
  # 规则引擎配置
  rules:
    cache-ttl-minutes: 60
    sensitive-words-refresh-interval-hours: 24

# 日志配置
logging:
  level:
    root: INFO
    com.xhs.audit: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/xhs-audit.log
    max-size: 100MB
    max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: xhs-audit
    distribution:
      percentiles-histogram:
        audit.duration: true
        crawler.duration: true
        llm.duration: true
# Springdoc OpenAPI配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: true
