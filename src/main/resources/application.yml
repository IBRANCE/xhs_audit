spring:
  application:
    name: xhs-audit
  
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/xhs_audit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 连接池配置 - 优化后的事务模型下，数据库操作时间短，适度扩容提供缓冲
      maximum-pool-size: 20          # 最大连接数（从默认10扩展到20）
      minimum-idle: 5                # 最小空闲连接数（降低至5以节省资源）
      connection-timeout: 10000      # 连接超时时间（10秒，足够短时操作）
      idle-timeout: 300000           # 空闲连接超时时间（5分钟）
      max-lifetime: 1800000          # 连接最大生命周期（30分钟）
      leak-detection-threshold: 60000  # 连接泄漏检测阈值（60秒，爬虫操作可能耗时较长）
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4
  
  # Cache配置
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m
  
  # Spring AI配置
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-local-test}
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:1234/v1}
      chat:
        model: ${OPENAI_CHAT_MODEL:qwen/qwen3-4b}
        temperature: 0.3
        max-tokens: 2000
        think-enabled: ${OPENAI_CHAT_THINK_ENABLED:false}  # 文本模型是否开启思考模式，默认关闭
      vision:
        model: ${OPENAI_VISION_MODEL:zai-org/glm-4.6v-flash}
        temperature: 0.3
        max-tokens: 2000
  
  # 文件上传配置  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 0
  
  web:
    resources:
      static-locations: classpath:/static/

  # Thymeleaf配置
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8
  
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
  max-http-request-header-size: 10MB

# 审核系统配置
audit:
  # 爬虫配置
  crawler:
    browser-pool-size: 3
    concurrent-crawl-threads: 3
    timeout-seconds: 30
    retry-times: 3
    headless: true  # 是否使用无头浏览器（开发环境建议false，生产环境建议true）
    delay-ms:
      min: 2000
      max: 5000
    # Selenium Grid 配置
    selenium:
      grid-url: ${SELENIUM_GRID_URL:http://localhost:4444}  # Selenium Grid Hub 地址
      pool-size: ${SELENIUM_POOL_SIZE:4}  # Driver 池大小，支持并发
      page-load-timeout: 20  # 页面加载超时时间（秒）
      implicit-wait: 5  # 隐式等待时间（秒）
      mobile-mode: ${SELENIUM_MOBILE_MODE:true}  # 是否模拟移动设备
  
  # 线程池配置
  executor:
    core-pool-size: 10
    max-pool-size: 50
    queue-capacity: 1000
    keep-alive-seconds: 60
    await-termination-seconds: 300
  
  # Excel配置
  excel:
    max-file-size: 52428800  # 50MB
    max-links-per-file: 5000
    batch-size: 100
  
  # Vision配置（可选）
  vision:
    enabled: true
    provider: local-vision
    max-image-size: 20971520  # 20MB
    request-timeout: 30

  # 图片缓存配置
  image-cache-ttl-hours: 24  # 图片base64缓存过期时间（小时）
  
  # LLM调用配置
  llm:
    timeout-seconds: 30
    max-retries: 3
    retry-delay-ms: 2000
  
  # 规则引擎配置
  rules:
    cache-ttl-minutes: 60
    sensitive-words-refresh-interval-hours: 24

  # 审核 Prompt 配置
  prompts:
    # 文本审核 System Prompt
    text-system: |
      你是一个专业的小红书内容审核专家。你的职责是评估用户上传的东风日产品牌内容是否符合以下规则。

      ============================================
      【东风日产内容审核规则】
      ============================================

      【规则1：车型露出要求】
      - 必须露出东风日产三品牌车型之一：日产(NISSAN)、启辰(Venucia)、英菲尼迪(INFINITI)
      - 日产品牌车型：天籁、轩逸、逍客、奇骏、X-TRAIL、ARIYA艾睿雅、N7、探陆等
      - 启辰品牌车型：启辰大V、启辰星、启辰D60等
      - 英菲尼迪品牌车型：QX50、QX60、Q50L等
      - 内容必须为车型相关的正向内容（UGC指用户原创内容）
      - 负面内容、投诉、维权类内容不予通过

      【规则2：笔记格式要求】
      - 图文类：文字≥25字 且 图片≥1张
      - 视频类：视频时长≥15秒

      【规则3：话题标签要求】
      - 必须带3个必选话题：#东风日产；#（车型名称，如 日产N7）；#尽兴由NI
      - 可根据实际情况带更多热门标签

      ============================================
      【审核步骤】
      ============================================
      第1步：检查内容是否包含东风日产三品牌车型
      第2步：检查笔记格式是否符合要求（字数、图片/视频）
      第3步：检查话题标签是否包含3个必带话题
      第4步：检查内容是否为正向内容（排除负面、投诉、维权）
      第5步：综合判断，生成审核结果

      ============================================
      【决策标准】
      ============================================
      - PASSED（通过）: 满足所有规则，置信度 >= 0.8
      - REJECTED（驳回）: 任意一条规则不满足
      - UNCERTAIN（不确定）: 置信度 < 0.7，或需要人工复核

      ============================================
      【输出格式】（严格JSON）
      ============================================
      {
        "status": "PASSED|REJECTED|UNCERTAIN",
        "reasons": [
          {
            "dimension": "car_model|content_type|tag|attitude",
            "reason": "具体原因",
            "severity": "LOW|MEDIUM|HIGH|CRITICAL"
          }
        ],
        "confidenceScore": 0.95,
        "suggestedAction": "通过|驳回|人工复核",
        "riskLevel": "LOW|MEDIUM|HIGH|CRITICAL",
        "modelName": "gpt-4-turbo"
      }

      【注意事项】
      1. 严格按规则审核，不要凭空猜测
      2. 必须检查3个必带话题是否齐全
      3. 对于边界case，宁可标记UNCERTAIN交由人工
      4. 严格按照JSON格式返回结果，不要添加额外说明

    # 图片审核 Prompt
    text-image: "请识别这张图片中是否有东风日产三品牌车型（日产NISSAN、启辰Venucia、英菲尼迪INFINITI），回复车型名称或'无'"

    # 图片审核通过的关键词（用于判断结果）
    image-pass-keywords: "天籁|轩逸|逍客|奇骏|N7|探陆|ARIYA|启辰|英菲尼迪|QX50|QX60|Q50L|NISSAN|Venucia|INFINITI"

# 日志配置
logging:
  level:
    root: INFO
    com.xhs.audit: DEBUG
    org.springframework.ai: DEBUG
    org.apache.poi.openxml4j.opc.PackageRelationshipCollection: OFF
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/xhs-audit.log
    max-size: 100MB
    max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: xhs-audit
    distribution:
      percentiles-histogram:
        audit.duration: true
        crawler.duration: true
        llm.duration: true
# Springdoc OpenAPI配置
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
  show-actuator: true
