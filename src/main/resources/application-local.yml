# 本地开发配置文件
# 使用方式: mvn spring-boot:run -Dspring-boot.run.profiles=local
# 或者设置环境变量: export SPRING_PROFILES_ACTIVE=local

spring:
  # JPA 配置 - 开发环境
  jpa:
    hibernate:
      ddl-auto: none  # 不让 Hibernate 管理表结构，完全由 Flyway 负责
    show-sql: true    # 显示 SQL 语句
    properties:
      hibernate:
        format_sql: true

  # Flyway 配置 - 开发环境
  flyway:
    enabled: true           # 启用 Flyway
    clean-disabled: false   # 允许清空数据库
    baseline-on-migrate: true
    # 每次启动时清空并重建（可选，与 ddl-auto 二选一）
    # clean-on-validation-error: true

  ai:
    openai:
      # 本地模型服务地址（不要包含/v1，代码会自动追加）
      base-url: http://localhost:1234
      # 本地模型不需要真实的API Key
      api-key: sk-local-test
      # 请求超时时间（秒），本地模型推理可能较慢
      timeout: 300

      # 文本模型配置
      chat:
        model: qwen/qwen3-4b
        temperature: 0.7
        max-tokens: -1

      # 图像模型配置
      vision:
        model: zai-org/glm-4.6v-flash
        temperature: 0.7
        max-tokens: -1

# 审核配置
audit:
  # 规则验证配置
  rules:
    min-text-length: 25      # 最小正文字数
    min-image-count: 1       # 最小图片数量

  # Worker 模式配置
  worker:
    enabled: true
    type: both          # 同时启用 crawler-worker 和 audit-worker
    consumer-name-prefix: local-dev

  # 视觉相关配置
  vision:
    enabled: false
    provider: local-vision
    max-image-size: 20971520  # 20MB
    request-timeout: 30

  # 图片缓存配置
  image-cache-ttl-hours: 24  # 图片base64缓存过期时间（小时）

  # 审核 Prompt 配置
  prompts:
    # 文本审核 System Prompt
    text-system: |
      你是东风日产内容审核专家，负责审核小红书内容的**相关性和态度**。
      
      注意：基础规则（字数、图片、标签）已由系统预检，你只需判断以下2点：

      ============================================
      【审核要点】
      ============================================
      
      1. **内容相关性**（car_model）
         - 内容是否真实涉及东风日产三品牌车型？
         - 品牌：日产(NISSAN)、启辰(Venucia)、英菲尼迪(INFINITI)
         - 常见车型：天籁、轩逸、逍客、奇骏、N7、N6、NX8、探陆、ARIYA、启辰大V、QX50等
         - 警惕：仅提及品牌但无实质车型内容 → REJECTED
      
      2. **内容态度**（attitude）
         - 必须为**正向**内容（用户分享、体验、推荐）
         - 驳回：负面评价、投诉、维权、抱怨等 → REJECTED
         - 边界case（如客观对比）→ UNCERTAIN，交由人工

      ============================================
      【决策标准】
      ============================================
      - PASSED：内容相关且态度正向，置信度 ≥ 0.8
      - REJECTED：内容不相关 或 态度负面
      - UNCERTAIN：置信度 < 0.7 或 难以判断

      ============================================
      【输出格式】（严格JSON）
      ============================================
      {
        "status": "PASSED|REJECTED|UNCERTAIN",
        "reasons": [
          {
            "dimension": "car_model|attitude",
            "reason": "简短理由",
            "severity": "LOW|MEDIUM|HIGH|CRITICAL"
          }
        ],
        "confidenceScore": 0.95,
        "suggestedAction": "通过|驳回|人工复核",
        "riskLevel": "LOW|MEDIUM|HIGH|CRITICAL",
        "modelName": "qwen3-4b"
      }

      【示例】
      ✅ 通过："分享我的天籁用车体验，油耗表现不错" → PASSED
      ❌ 驳回："轩逸变速箱又出问题了，真是烦死了" → REJECTED (负面)
      ❌ 驳回："今天路上看到一辆日产车" → REJECTED (无实质内容)
      ⚠️ 不确定："对比了天籁和雅阁，各有优劣" → UNCERTAIN (需人工)

    # 图片审核 Prompt
    text-image: "请识别这张图片中是否有东风日产三品牌车型（日产NISSAN、启辰Venucia、英菲尼迪INFINITI），回复车型名称或'无'"

    # 图片审核通过的关键词（用于判断结果）
    image-pass-keywords: "天籁|轩逸|逍客|奇骏|N6|N7|NX8|探陆|ARIYA|启辰|英菲尼迪|QX50|QX60|Q50L|NISSAN|Venucia|INFINITI"

  # 爬虫配置（覆盖默认配置）
  crawler:
    concurrent-crawl-threads: 8  # 并发爬取线程数，匹配浏览器实例数
    selenium:
      pool-size: 8  # Selenium Driver 池大小
      mobile-mode: true  # 本地开发环境使用移动模式

# 开发环境日志级别
logging:
  level:
    root: INFO
    com.xhs.audit: DEBUG
    org.springframework.ai: DEBUG
